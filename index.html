<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Овощная битва — Veggie Battle Royale</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#127814;</text></svg>">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f0a;
    font-family: 'Segoe UI', system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  .hud { position: fixed; z-index: 10; color: #fff; user-select: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; }

  #crosshair { left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 22px; line-height: 1; opacity: .9; }
  #hitmark { left: 50%; top: 55%; transform: translateX(-50%);
    font-size: 17px; font-weight: 700; color: #ffe066; opacity: 0;
    transition: opacity .25s; }

  #stats { top: 14px; right: 16px; text-align: right; font-size: 15px; }
  #stats b { font-size: 19px; }
  #zoneline { opacity: .85; }

  #feed { top: 14px; left: 16px; font-size: 13px; opacity: .9; }
  #feed div { margin-bottom: 2px; }

  #hpwrap { left: 16px; bottom: 18px; width: 240px; }
  #hpbar { height: 14px; background: rgba(0,0,0,.45); border-radius: 7px;
    overflow: hidden; border: 1px solid rgba(255,255,255,.25); }
  #hpfill { height: 100%; width: 100%; background: #4fd35a;
    transition: width .12s, background .3s; }
  #hptext { font-size: 13px; margin-top: 4px; }
  /* veggie meter — pips fill as produce sticks to you, bin at full */
  #vegbar { display: flex; gap: 3px; margin-top: 5px; }
  #vegbar .pip { flex: 1; height: 8px; border-radius: 3px;
    background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.2); }
  #vegbar .pip.on { background: #8fc94f; border-color: #b6e68a; }
  #vegbar .pip.on.hot { background: #e23b2e; border-color: #ff9078;
    animation: vegpulse .5s infinite alternate; }
  #vegbar.hidden { visibility: hidden; }
  @keyframes vegpulse { from { filter: brightness(1); } to { filter: brightness(1.7); } }
  #veglabel { font-size: 11px; color: #ffb3a3; margin-top: 2px;
    text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  /* floating damage/heal numbers near the crosshair */
  .fct { position: fixed; z-index: 12; font-size: 21px; font-weight: 800;
    pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.9);
    animation: fctfloat 1s ease-out forwards; }
  .fct.dmg { color: #ff6a5e; }
  .fct.heal { color: #7cf58a; }
  @keyframes fctfloat {
    0% { opacity: 0; transform: translateY(8px) scale(.8); }
    15% { opacity: 1; transform: translateY(0) scale(1.1); }
    100% { opacity: 0; transform: translateY(-46px) scale(1); }
  }
  #healflash { position: fixed; inset: 0; z-index: 9; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(60,255,110,.4) 100%);
    opacity: 0; transition: opacity .35s; }

  #veggies { left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; gap: 10px; }
  .chip { background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.25);
    border-radius: 10px; padding: 7px 12px; font-size: 13px; min-width: 92px;
    text-align: center; }
  .chip.sel { border-color: #ffd84d; box-shadow: 0 0 10px rgba(255,216,77,.5); }
  .chip.missing { opacity: .28; filter: grayscale(.9); }
  .chip.missing .sub { display: none; }
  .chip .k { color: #ffd84d; font-weight: 700; }
  .chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 5px; }
  .chip .sub { display: block; font-size: 11px; opacity: .75; margin-top: 2px; }

  #msg { left: 50%; top: 38%; transform: translate(-50%,-50%);
    text-align: center; }
  #msg .big { font-size: 42px; font-weight: 800; }
  #msg .small { font-size: 16px; opacity: .85; margin-top: 10px; }

  #help { left: 16px; bottom: 60px; font-size: 12px; opacity: .7; line-height: 1.5; }

  #dmgflash { position: fixed; inset: 0; z-index: 9; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(255,30,30,.55) 100%);
    opacity: 0; transition: opacity .35s; }
  #zoneflash { position: fixed; inset: 0; z-index: 8; pointer-events: none;
    box-shadow: inset 0 0 120px rgba(255,40,40,.5); opacity: 0; transition: opacity .5s; }

  #lobby { position: fixed; inset: 0; z-index: 30; display: flex;
    align-items: center; justify-content: center;
    background: rgba(5,10,5,.82); color: #fff; user-select: none; }
  #lobby.hidden { display: none; }
  #lobby .panel { background: rgba(10,16,10,.92); border: 1px solid rgba(255,255,255,.2);
    border-radius: 14px; padding: 28px 34px; width: 320px; text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,.6); }
  #lobby h1 { margin: 0 0 18px; font-size: 26px; letter-spacing: 1px; }
  #lobby input { display: block; width: 100%; box-sizing: border-box;
    margin: 8px 0; padding: 10px 12px; font-size: 15px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.4);
    color: #fff; outline: none; }
  #lobby input:focus { border-color: #ffd84d; }
  #lobby button { display: block; width: 100%; margin: 10px 0 0;
    padding: 11px 0; font-size: 15px; font-weight: 700; border: 0;
    border-radius: 8px; cursor: pointer; }
  #lobby button.primary { background: #4fd35a; color: #062; }
  #lobby button.ghost { background: rgba(255,255,255,.12); color: #fff; }
  #lobby button:hover { filter: brightness(1.1); }
  #lobbyInfo { margin-top: 14px; font-size: 13px; line-height: 1.6;
    min-height: 20px; opacity: .9; }
  #lobbyInfo .roster { color: #ffd84d; }
  #lobbyInfo .countdown { font-size: 22px; font-weight: 800; color: #aef78e; }

  /* character picker — 3D carousel between lobby and drop */
  #charSel { position: fixed; inset: 0; z-index: 29; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,10,5,.85); color: #fff; user-select: none; }
  #charSel.hidden { display: none; }
  #charSel .csTitle { font-size: 30px; font-weight: 800; letter-spacing: 2px;
    margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #csCanvas { width: min(900px, 92vw); height: min(440px, 55vh); }
  .csRow { display: flex; align-items: center; gap: 22px; margin-top: 2px; }
  .csArrow { width: 52px; height: 52px; font-size: 30px; line-height: 1;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.12); color: #fff; cursor: pointer; }
  .csArrow:hover { filter: brightness(1.25); }
  #csName { min-width: 160px; text-align: center; font-size: 24px;
    font-weight: 800; color: #ffd84d; }
  #charSel button.csBtn { margin: 10px 4px 0; padding: 11px 42px;
    font-size: 16px; font-weight: 700; border: 0; border-radius: 8px;
    cursor: pointer; }
  #csGo { background: #4fd35a; color: #062; }
  #csBack { background: rgba(255,255,255,.12); color: #fff; }
  .csBtns { display: flex; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
  <div id="app"></div>

  <div id="dmgflash"></div>
  <div id="zoneflash"></div>
  <div id="crosshair" class="hud">+</div>
  <div id="hitmark" class="hud"></div>
  <div id="stats" class="hud"><b id="alive"></b><br /><span id="zoneline"></span><br /><span id="kills"></span></div>
  <div id="feed" class="hud"></div>
  <div id="hpwrap" class="hud"><div id="hpbar"><div id="hpfill"></div></div><div id="vegbar"></div><div id="veglabel"></div><div id="hptext"></div></div>
  <div id="healflash"></div>
  <div id="veggies" class="hud"></div>
  <div id="help" class="hud">WASD — бег · Shift — ускорение · Space — прыжок<br />ЛКМ — выстрел · 10 прилипаний = бак! · E — пнуть бак / ящик / кнопка · R — заново<br />1/2 · колесо — оружие</div>
  <div id="kickhint" class="hud" style="left:50%;top:62%;transform:translateX(-50%);
    font-size:20px;font-weight:800;color:#aef78e;opacity:0;transition:opacity .15s;">E — ПНУТЬ БАК!</div>
  <div id="scope" class="hud" style="inset:0;opacity:0;transition:opacity .2s;pointer-events:none;
    background:radial-gradient(circle at 50% 50%, transparent 26%, rgba(0,0,0,.93) 27.5%);">
    <div style="position:absolute;left:50%;top:50%;width:52vmin;height:52vmin;transform:translate(-50%,-50%);
      border:2px solid rgba(255,255,255,.35);border-radius:50%;"></div>
    <div style="position:absolute;left:50%;top:50%;width:1px;height:52vmin;background:rgba(255,255,255,.4);transform:translate(-50%,-50%);"></div>
    <div style="position:absolute;left:50%;top:50%;width:52vmin;height:1px;background:rgba(255,255,255,.4);transform:translate(-50%,-50%);"></div>
  </div>
  <div id="msg" class="hud"></div>

  <div id="lobby">
    <div class="panel">
      <h1>ОВОЩНАЯ БИТВА</h1>
      <input id="nick" placeholder="ник" maxlength="14" autocomplete="off">
      <input id="room" placeholder="код комнаты" maxlength="8" autocomplete="off">
      <button id="joinBtn" class="primary">В лобби</button>
      <button id="soloBtn" class="ghost">Одиночная игра</button>
      <div id="lobbyInfo"></div>
    </div>
  </div>

  <div id="charSel" class="hidden">
    <div class="csTitle">ВЫБЕРИ БОЙЦА</div>
    <canvas id="csCanvas"></canvas>
    <div class="csRow">
      <button id="csPrev" class="csArrow">‹</button>
      <div id="csName"></div>
      <button id="csNext" class="csArrow">›</button>
    </div>
    <div class="csBtns">
      <button id="csBack" class="csBtn">назад</button>
      <button id="csGo" class="csBtn">В БОЙ</button>
    </div>
  </div>

  <script type="module" src="./src/view/main.js?v=2"></script>
</body>
</html>
