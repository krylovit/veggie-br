<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Овощная битва — Veggie Battle Royale</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f0a;
    font-family: 'Segoe UI', system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  .hud { position: fixed; z-index: 10; color: #fff; user-select: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; }

  #crosshair { left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 22px; line-height: 1; opacity: .9; }
  #hitmark { left: 50%; top: 55%; transform: translateX(-50%);
    font-size: 17px; font-weight: 700; color: #ffe066; opacity: 0;
    transition: opacity .25s; }

  #stats { top: 14px; right: 16px; text-align: right; font-size: 15px; }
  #stats b { font-size: 19px; }
  #zoneline { opacity: .85; }

  #feed { top: 14px; left: 16px; font-size: 13px; opacity: .9; }
  #feed div { margin-bottom: 2px; }

  #hpwrap { left: 16px; bottom: 18px; width: 240px; }
  #hpbar { height: 14px; background: rgba(0,0,0,.45); border-radius: 7px;
    overflow: hidden; border: 1px solid rgba(255,255,255,.25); }
  #hpfill { height: 100%; width: 100%; background: #4fd35a;
    transition: width .12s, background .3s; }
  #hptext { font-size: 13px; margin-top: 4px; }

  #veggies { left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; gap: 10px; }
  .chip { background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.25);
    border-radius: 10px; padding: 7px 12px; font-size: 13px; min-width: 92px;
    text-align: center; }
  .chip.sel { border-color: #ffd84d; box-shadow: 0 0 10px rgba(255,216,77,.5); }
  .chip .k { color: #ffd84d; font-weight: 700; }
  .chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 5px; }
  .chip .sub { display: block; font-size: 11px; opacity: .75; margin-top: 2px; }

  #msg { left: 50%; top: 38%; transform: translate(-50%,-50%);
    text-align: center; }
  #msg .big { font-size: 42px; font-weight: 800; }
  #msg .small { font-size: 16px; opacity: .85; margin-top: 10px; }

  #help { left: 16px; bottom: 60px; font-size: 12px; opacity: .7; line-height: 1.5; }

  #dmgflash { position: fixed; inset: 0; z-index: 9; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(255,30,30,.55) 100%);
    opacity: 0; transition: opacity .35s; }
  #zoneflash { position: fixed; inset: 0; z-index: 8; pointer-events: none;
    box-shadow: inset 0 0 120px rgba(255,40,40,.5); opacity: 0; transition: opacity .5s; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
  <div id="app"></div>

  <div id="dmgflash"></div>
  <div id="zoneflash"></div>
  <div id="crosshair" class="hud">+</div>
  <div id="hitmark" class="hud"></div>
  <div id="stats" class="hud"><b id="alive"></b><br /><span id="zoneline"></span><br /><span id="kills"></span></div>
  <div id="feed" class="hud"></div>
  <div id="hpwrap" class="hud"><div id="hpbar"><div id="hpfill"></div></div><div id="hptext"></div></div>
  <div id="veggies" class="hud"></div>
  <div id="help" class="hud">WASD — бег · Shift — ускорение · Space — прыжок<br />ЛКМ — выстрел · 10 прилипаний = бак! · E — пнуть бак · R — заново<br />1/2 · колесо — оружие</div>
  <div id="kickhint" class="hud" style="left:50%;top:62%;transform:translateX(-50%);
    font-size:20px;font-weight:800;color:#aef78e;opacity:0;transition:opacity .15s;">E — ПНУТЬ БАК!</div>
  <div id="scope" class="hud" style="inset:0;opacity:0;transition:opacity .2s;pointer-events:none;
    background:radial-gradient(circle at 50% 50%, transparent 26%, rgba(0,0,0,.93) 27.5%);">
    <div style="position:absolute;left:50%;top:50%;width:52vmin;height:52vmin;transform:translate(-50%,-50%);
      border:2px solid rgba(255,255,255,.35);border-radius:50%;"></div>
    <div style="position:absolute;left:50%;top:50%;width:1px;height:52vmin;background:rgba(255,255,255,.4);transform:translate(-50%,-50%);"></div>
    <div style="position:absolute;left:50%;top:50%;width:52vmin;height:1px;background:rgba(255,255,255,.4);transform:translate(-50%,-50%);"></div>
  </div>
  <div id="msg" class="hud"></div>

  <script type="module" src="./src/view/main.js"></script>
</body>
</html>
